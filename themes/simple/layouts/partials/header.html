<header>
    <div class="site-banner" role="img" aria-label="Dappled leaf shadows on a sunlit plaster wall"></div>
    <nav>
        <div class="logo">
            <a href="/">{{ .Site.Title }}</a>
        </div>
        <ul class="menu">
            {{ range .Site.Menus.main }}
            <li><a href="{{ .URL }}">{{ .Name }}</a></li>
            {{ end }}
        </ul>
    </nav>
</header>
